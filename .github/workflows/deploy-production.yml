name: Deploy to Production (DigitalOcean)

# Pushes to `production` are tested, built into a GHCR image tagged with the
# commit sha, and rolled out on the droplet by /opt/diamond-erp/deploy/deploy.sh,
# which health-checks the new container and rolls back automatically.
on:
  push:
    branches:
      - production
  workflow_dispatch:

# Never run two deploys of this service at once; queue instead of cancelling.
concurrency:
  group: deploy-do-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/powerbrainlabs/diamond-erp-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:production
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          [ -n "$DO_SSH_KEY" ] && [ -n "$DO_KNOWN_HOSTS" ] || { echo "DO_SSH_KEY / DO_KNOWN_HOSTS secrets are not set"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server's forced command runs deploy.sh with "<service> <sha>".
      # The short-lived GITHUB_TOKEN goes over stdin so the server can pull
      # the image without storing a registry credential.
      - name: Deploy on droplet
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$DO_HOST" ] || { echo "DO_HOST secret is not set"; exit 1; }
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes "deploy@$DO_HOST" "backend $GITHUB_SHA"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
