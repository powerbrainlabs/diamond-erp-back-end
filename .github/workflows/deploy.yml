name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script: |
            cd /home/ec2-user/app

            # Pull latest code (hard reset to avoid local-change conflicts)
            git fetch origin main
            git reset --hard origin/main

            # Ensure Poppins system font is installed (needed for Playwright PDF rendering)
            if ! fc-list | grep -q Poppins; then
              mkdir -p /home/ec2-user/.local/share/fonts/poppins
              curl -sLo /home/ec2-user/.local/share/fonts/poppins/Poppins-Regular.ttf 'https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Regular.ttf'
              curl -sLo /home/ec2-user/.local/share/fonts/poppins/Poppins-Medium.ttf 'https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Medium.ttf'
              curl -sLo /home/ec2-user/.local/share/fonts/poppins/Poppins-SemiBold.ttf 'https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-SemiBold.ttf'
              curl -sLo /home/ec2-user/.local/share/fonts/poppins/Poppins-Bold.ttf 'https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf'
              fc-cache -f /home/ec2-user/.local/share/fonts/
            fi

            # Install any new dependencies (use python3.11)
            python3.11 -m pip install -r requirements.txt --quiet --user

            # Restart the service
            sudo systemctl restart diamond-erp

            # Wait and verify it's running
            sleep 5
            sudo systemctl is-active diamond-erp

            # TEMP DIAGNOSTIC — checking whether staging's real rendering
            # pipeline has the same small-bold-text corruption bug found
            # on production, or whether it's genuinely environment-
            # specific. Remove after checking the Action log.
            echo "=== FONT DIAGNOSTIC ==="
            python3.11 -c "from playwright.sync_api import sync_playwright; html = '<html><head><style>body{font-family:Poppins,sans-serif;font-size:8px}.b{font-weight:700}</style></head><body><div class=\"b\">Gross Weight Natural Diamond Conclusion Certificate</div><div>Certificate No Shape Color Clarity</div></body></html>'; p = sync_playwright().start(); b = p.chromium.launch(); pg = b.new_page(); pg.set_content(html, wait_until='networkidle'); pg.wait_for_timeout(500); pdf = pg.pdf(format='A4', print_background=True); open('/tmp/diag.pdf','wb').write(pdf); b.close(); p.stop()" 2>&1
            base64 -w0 /tmp/diag.pdf 2>&1 || base64 /tmp/diag.pdf 2>&1
            echo "=== END FONT DIAGNOSTIC ==="
